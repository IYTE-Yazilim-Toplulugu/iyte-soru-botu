[project]
name = "auth"
version = "0.1.0"
description = "Auth management service for IYTE Soru Botu"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
        "fastapi>=0.128.0",
        "psycopg2-binary>=2.9.11",
        "python-dotenv>=1.2.1",
        "python-ulid>=3.1.0",
        "shared-kernel",
        "sqlmodel>=0.0.30",
        "uvicorn>=0.40.0",
        "pydantic[email]>=2.12.5",
        "bcrypt>=4.0.0",
        "pyjwt>=2.8.0",
        "mypy>=1.19.1",
        "ruff>=0.14.10",
]

[tool.uv.sources]
shared-kernel = { path = "../../libs/shared-kernel", editable = true }
