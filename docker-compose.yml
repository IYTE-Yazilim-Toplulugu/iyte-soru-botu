services:

  gateway:
    build:
      context: ./src/gateway
      dockerfile: Dockerfile
    container_name: iyte-gateway
    ports:
      - "8000:8000"
    environment:
      - AUTH_SERVICE_URL=http://auth:8081
      - CHAT_SERVICE_URL=http://chat:8080
      - DOCUMENT_SERVICE_URL=http://document:8082
      - REDIS_HOST=gateway-redis
      - REDIS_PORT=6379
    depends_on:
      - gateway-redis
      - auth
      - chat
      - document
    networks:
      - iyte-network
    restart: unless-stopped

  auth:
    build:
      context: ./src/services/auth
      dockerfile: Dockerfile
    container_name: iyte-auth
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@auth-db:5432/auth_db
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=RS256
      - ACCESS_TOKEN_EXPIRE=3600
      - REFRESH_TOKEN_EXPIRE=2592000
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - iyte-network
    restart: unless-stopped
    volumes:
      - ./src/services/auth:/app

  chat:
    build:
      context: ./src/services/chat
      dockerfile: Dockerfile
    container_name: iyte-chat
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@chat-db:5432/chat_db
      - REDIS_HOST=chat-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8001
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATAFETCH_GRPC_HOST=document
      - DATAFETCH_GRPC_PORT=50051
      - PROJECT_NAME=chat-service
      - API_V1_STR=/api/v1/chat
      - FRONTEND_MAIN_ORIGIN=${FRONTEND_MAIN_ORIGIN:-http://localhost:3000}
    depends_on:
      chat-db:
        condition: service_healthy
      chat-redis:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - iyte-network
    restart: unless-stopped
    volumes:
      - ./src/services/chat:/app

  document:
    build:
      context: ./src/services/document
      dockerfile: Dockerfile
    container_name: iyte-document
    ports:
      - "8082:8082"
      - "50051:50051"  # gRPC port
    environment:
      - MONGODB_URL=mongodb://root:root@document-db:27017/
      - MONGODB_DATABASE=document_db
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=documents
      - MINIO_SECURE=false
    depends_on:
      document-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - iyte-network
    restart: unless-stopped
    volumes:
      - ./src/services/document:/app

  auth-db:
    image: postgres:16-alpine
    container_name: iyte-auth-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=auth_db
    ports:
      - "5433:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    networks:
      - iyte-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chat-db:
    image: postgres:16-alpine
    container_name: iyte-chat-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=chat_db
    ports:
      - "5432:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    networks:
      - iyte-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  document-db:
    image: mongo:7
    container_name: iyte-document-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=root
      - MONGO_INITDB_DATABASE=document_db
    ports:
      - "27017:27017"
    volumes:
      - document-db-data:/data/db
    networks:
      - iyte-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway-redis:
    image: redis:7-alpine
    container_name: iyte-gateway-redis
    ports:
      - "6380:6379"
    volumes:
      - gateway-redis-data:/data
    networks:
      - iyte-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  chat-redis:
    image: redis:7-alpine
    container_name: iyte-chat-redis
    ports:
      - "6379:6379"
    volumes:
      - chat-redis-data:/data
    networks:
      - iyte-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --appendonly yes

  chromadb:
    image: chromadb/chroma:latest
    container_name: iyte-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - iyte-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: iyte-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    networks:
      - iyte-network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # MinIO Bucket Initialization
  minio-init:
    image: minio/mc:latest
    container_name: iyte-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - iyte-network
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin};
      mc mb myminio/documents --ignore-existing;
      mc anonymous set download myminio/documents;
      exit 0;
      "

networks:
  iyte-network:
    driver: bridge
    name: iyte-network

volumes:
  auth-db-data:
    name: iyte-auth-db-data
  chat-db-data:
    name: iyte-chat-db-data
  document-db-data:
    name: iyte-document-db-data
  gateway-redis-data:
    name: iyte-gateway-redis-data
  chat-redis-data:
    name: iyte-chat-redis-data
  chromadb-data:
    name: iyte-chromadb-data
  minio-data:
    name: iyte-minio-data
